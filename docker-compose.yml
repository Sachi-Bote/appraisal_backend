services:

  backend:
    build:
      context: ./appraisal_dp/appraisal_backend
      dockerfile: Dockerfile

    image: appraisal-backend:local
    container_name: appraisal_backend

    restart: unless-stopped

    expose:
      - "8000"

    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: appraisal
      DB_USER: appraisal_manager
      DB_PASSWORD: StrongPassword123
      DB_HOST: db
      DB_PORT: 5432

      DJANGO_DEBUG: "0"

      DJANGO_SECRET_KEY: django-secret-key

      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,172.16.0.18,172.16.0.19"

      DJANGO_CORS_ALLOWED_ORIGINS: "http://172.16.0.18,http://172.16.0.19"

      DJANGO_CSRF_TRUSTED_ORIGINS: "http://172.16.0.18,http://172.16.0.19"

      DJANGO_CORS_ALLOW_ALL_ORIGINS: "0"

      DJANGO_SECURE_SSL_REDIRECT: "0"
      DJANGO_SESSION_COOKIE_SECURE: "0"
      DJANGO_CSRF_COOKIE_SECURE: "0"
      DJANGO_SECURE_HSTS_SECONDS: "0"

      DJANGO_SETTINGS_MODULE: appraisal_backend.settings

      BOOTSTRAP_ADMIN_USERNAME: appraisaladmin
      BOOTSTRAP_ADMIN_PASSWORD: Admin@123
      BOOTSTRAP_ADMIN_EMAIL: harshal.muknak@mescoepune.org
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./appraisal-form
      dockerfile: Dockerfile

    image: appraisal-frontend:local
    container_name: appraisal_frontend

    restart: unless-stopped

    expose:
      - "80"

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile

    image: appraisal-nginx:local
    container_name: appraisal_nginx

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend
      - frontend

  db:
    image: postgres:15

    container_name: appraisal_db

    restart: unless-stopped

    environment:
      POSTGRES_DB: appraisal
      POSTGRES_USER: appraisal_manager
      POSTGRES_PASSWORD: StrongPassword123

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appraisal_manager -d appraisal"]
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: